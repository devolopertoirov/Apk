name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Zipni ochish
        run: unzip -q -o SafeApkGuard.zip
      - name: Kalitni tayyorlash
        if: env.KS_B64 != ''
        run: echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
      - name: APK yigish (doimiy imzo)
        if: env.KS_B64 != ''
        working-directory: SafeApkGuard
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: safeapkguard
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: APK yigish (test imzosi)
        if: env.KS_B64 == ''
        working-directory: SafeApkGuard
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SafeApkGuard-apk
          path: SafeApkGuard/app/build/outputs/apk/*/*.apk
